name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PySpark 4 supports Java 17 and 21. The runner default drifts over time,
      # so the version is pinned rather than inherited.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # Delta resolves its JARs through Ivy on first use. Caching them keeps
      # the run from re-downloading on every push.
      - name: Cache Ivy jars
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ hashFiles('pyproject.toml') }}

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q
